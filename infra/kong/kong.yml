_format_version: "3.0"

services:
  - name: identity-service
    # Nome do container Docker na rede interna do compose
    url: http://identity:8080
    connect_timeout: 3000
    write_timeout: 5000
    read_timeout: 5000
    retries: 2
    routes:
      - name: identity-routes
        paths:
          - /api/auth
          - /api/users
        # strip_path define se remove o prefixo ao repassar ao Spring Boot:
        # - false: repassa /api/auth/... intacto ao Identity
        # - true: se seu controller no Spring mapear apenas /login, Kong remove /api/auth
        strip_path: false
        preserve_host: true

plugins:
  # Injeção padronizada de Correlation ID para rastreabilidade e MDC
  - name: correlation-id
    config:
      header_name: X-Correlation-ID
      generator: uuid
      echo_downstream: true

  # Proteção de cabeçalhos e pre-flight requests para o front (Next.js/React)
  - name: cors
    config:
      origins:
        - "http://localhost"
        - "http://localhost:3000"
        - "http://127.0.0.1"
        - "http://127.0.0.1:3000"
        - "http://localhost:80"
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      headers:
        - Accept
        - Authorization
        - Content-Type
        - X-Correlation-ID
        - Idempotency-Key
      exposed_headers:
        - X-Correlation-ID
      credentials: true
      max_age: 3600
